apiVersion: v1
kind: Pod
metadata:
  name: {{ include "wafer-inspection.fullname" . }}-test
  labels:
    {{- include "wafer-inspection.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health-check
      image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      command: ["wget"]
      args: ["-qO-", "http://{{ include "wafer-inspection.fullname" . }}:{{ .Values.service.port }}/actuator/health/readiness"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsUser: 65534
        capabilities:
          drop: ["ALL"]
