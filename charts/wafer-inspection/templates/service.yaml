apiVersion: v1
kind: Service
metadata:
  name: {{ include "wafer-inspection.fullname" . }}
  labels:
    {{- include "wafer-inspection.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "wafer-inspection.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

